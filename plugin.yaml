name: live2d-rigger
version: "0.4.0"
description: "Create and rig editable Live2D characters from a brief, using native image tools and a selected real authoring/SDK toolchain, with motion review. Also opens a character you already have, shows how she is put together, changes how her hair or skirt swings on a copy, and renders the same motion before and after."
author: "Live2D Rigger contributors"
license: GPL-3.0-or-later
requires_hermes: ">=0.22.0"
python_dependencies:
  - "Pillow==13.0.0"
provides_tools:
  - live2d_begin_model
  - live2d_model_layer
  - live2d_model_rig
  - live2d_build_model
  - live2d_render_model_motion
  - live2d_model_status
  - live2d_open_model
  - live2d_inspect_model
  - live2d_adjust_physics
  - live2d_render_clip
  - live2d_write_motion
  - live2d_inspect_resources
  - live2d_check_motion
  - live2d_reference_samples
  - live2d_fetch_reference_sample
